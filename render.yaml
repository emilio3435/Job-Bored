# Keep the checkout root: materials reads schemas, templates and fonts beside server/.
services:
  - type: web
    name: command-center-job-scraper
    runtime: node
    buildCommand: npm ci --omit=dev --prefix server
    startCommand: cd server && node index.mjs
    healthCheckPath: /health
    buildFilter:
      paths:
        - server/**
        - schemas/**
        - templates/materials/**
        - vendor/fonts/**
    envVars:
      - key: LISTEN_HOST
        value: "0.0.0.0"
      # BEAUDIT E6: without a minted token and an explicit dashboard origin
      # allowlist, the hosted API boots with no auth and no CORS.
      - key: JOBBORED_API_TOKEN
        generateValue: true
      - key: COMMAND_CENTER_ALLOWED_ORIGINS
        sync: false
