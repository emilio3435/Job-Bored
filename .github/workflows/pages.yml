name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Assemble dashboard HTML
        run: node scripts/assemble-index.mjs --write

      - name: Build Pages artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'index.html' \
            --exclude 'index.assembled.html' \
            ./ _site/
          cp index.assembled.html _site/index.html
          cp config.example.js _site/config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
