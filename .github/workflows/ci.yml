name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per PR (or per branch on push); superseded PR runs are cancelled,
# pushes to main always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Branch-protection (ruleset "main") ENFORCES these checks by name — a
# failure blocks the merge: contract-tests, test (aggregate of test-shard),
# scan (gitleaks.yml), coverage, lint, audit-prod, pr-lint (pr-lint.yml).
# Renaming any of these jobs breaks the merge gate.
# Advisory only (never blocks a merge): e2e-smoke, e2e-journey, e2e-visual, audit-dev.
# F4-D hermetic harness is in place (tests/e2e-fixtures/hermetic-harness.mjs).
# Do NOT drop continue-on-error on the browser jobs until repair Gates A–D
# exist. Switch steps: docs/HERMETIC-BROWSER-GATE.md.
# Auto-release: .github/workflows/release.yml (release-please, runs on main
# pushes, opens a release PR — does not block PR merges).

jobs:
  # Hosted server images must pass auth, assets and real Chromium PDF checks.
  server-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: server/Dockerfile
            context: server
          - dockerfile: server/Dockerfile.render
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/stage-server-image-assets.mjs
      - run: docker build -t jobbored-server -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      - name: Smoke hosted auth, templates and PDF
        env:
          SMOKE_TOKEN: ci-smoke-token
        run: |
          set -euo pipefail
          container=$(docker run -d -p 3847:3847 -e JOBBORED_API_TOKEN="$SMOKE_TOKEN" -e COMMAND_CENTER_ALLOWED_ORIGINS=https://dashboard.example jobbored-server)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3847/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3847/api/materials/templates)" = 401
          curl --fail -H "Authorization: Bearer $SMOKE_TOKEN" http://127.0.0.1:3847/api/materials/templates > /tmp/templates.json
          node -e "const t=JSON.parse(require('fs').readFileSync('/tmp/templates.json')); if(!Array.isArray(t.templates)||!t.templates.length)process.exit(1)"
          curl --fail -H "Authorization: Bearer $SMOKE_TOKEN" 'http://127.0.0.1:3847/health?deep=1' > /tmp/deep.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/deep.json')); if(!h.ok||!h.checks.playwright.ok||h.checks.playwright.browser!=='system')process.exit(1)"
          docker exec "$container" node --input-type=module -e "import {renderPdfIfPossible} from './materials-pdf.mjs'; import {readFileSync} from 'node:fs'; const p='/tmp/smoke.pdf'; const r=await renderPdfIfPossible('<h1>Hosted PDF smoke</h1>',p); if(r.skipped||readFileSync(p).subarray(0,5).toString()!=='%PDF-')process.exit(1)"
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:contract:all

  # The unit gate runs as two parallel shards; the aggregate `test` job below
  # keeps the ruleset's required check name. Each shard is a whole suite, so
  # together they run exactly what the single job used to run.
  test-shard:
    name: test-shard (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, discovery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck repository, server, and discovery worker
        if: matrix.suite == 'unit'
        run: npm run typecheck:repo
      - if: matrix.suite == 'unit'
        run: npm test
      - if: matrix.suite == 'discovery'
        run: npm run test:browser-use-discovery

  # Required by the branch ruleset under this exact name. Fails unless every
  # shard succeeded (a skipped or cancelled shard also fails the check).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-shard, server-image-smoke]
    if: ${{ always() }}
    steps:
      - name: Require every test shard and hosted image to pass
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
          IMAGE_RESULT: ${{ needs.server-image-smoke.result }}
        run: |
          echo "test-shard result: $SHARD_RESULT"
          test "$SHARD_RESULT" = "success"
          echo "server-image-smoke result: $IMAGE_RESULT"
          test "$IMAGE_RESULT" = "success"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:repo

  # Browser boot-and-visibility smoke (tests/e2e-smoke). Non-blocking until
  # Gates A–D: hermetic fixtures are ready, but the required-CI switch waits
  # on the repair gate ledger. See docs/HERMETIC-BROWSER-GATE.md.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Read installed Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e-smoke
      # !cancelled() so traces of a test that failed then passed on retry
      # (reported "flaky") are kept too; retain-on-failure leaves the dir
      # empty when every attempt passed.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          if-no-files-found: ignore
          name: e2e-smoke-traces
          path: tests/e2e-smoke/test-results/
          retention-days: 7

  # Structural visual gate for S0 and the one shell (tests/e2e-visual). Non-blocking until
  # Gates A–D: hermetic fixtures are ready, but the required-CI switch waits
  # on the repair gate ledger. See docs/HERMETIC-BROWSER-GATE.md.
  e2e-visual:
    name: e2e-visual (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Read installed Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e-visual -- --shard=${{ matrix.shard }}/3
      # !cancelled() so traces of a test that failed then passed on retry
      # (reported "flaky") are kept too; retain-on-failure leaves the dir
      # empty when every attempt passed.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          if-no-files-found: ignore
          name: e2e-visual-traces-${{ matrix.shard }}
          path: tests/e2e-visual/test-results/
          retention-days: 7

  # Critical signed-in product journey (tests/e2e-journey). Non-blocking until
  # Gates A–D. Hermetic disposable auth + network fence live in
  # tests/e2e-fixtures/hermetic-harness.mjs. See docs/HERMETIC-BROWSER-GATE.md.
  e2e-journey:
    name: e2e-journey (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Read installed Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e-journey -- --shard=${{ matrix.shard }}/3
      # !cancelled() so traces of a test that failed then passed on retry
      # (reported "flaky") are kept too; retain-on-failure leaves the dir
      # empty when every attempt passed.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          if-no-files-found: ignore
          name: e2e-journey-traces-${{ matrix.shard }}
          path: tests/e2e-journey/test-results/
          retention-days: 7

  # Blocking: c8-driven coverage under scripts/run-tests.mjs with thresholds
  # enforced by `npm run test:coverage`. The lcov report is uploaded as the
  # `coverage-report` artifact for the coverage-comment workflow.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Unit suite under c8 (blocking)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Advisory: full audit across ALL deps (including dev). Stays non-blocking
  # so a dev-dep vuln surfaces as a signal without holding up a merge. The
  # blocking prod-only gate is audit-prod below.
  audit-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm audit --audit-level=high

  # Blocking: production-deps audit. High-severity production vulns fail the
  # required status check, so the merge is held until they are resolved.
  audit-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix server
